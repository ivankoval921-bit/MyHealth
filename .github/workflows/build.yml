name: Android CI & Release

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses and install platform 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyHealth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Release metadata on tag if not already published locally
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "MyHealth.apk"; then
            echo "Release $TAG already contains locally signed MyHealth.apk; keeping matching PC signing key."
          else
            CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
            NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            mkdir -p dist
            cp app/build/outputs/apk/debug/app-debug.apk dist/MyHealth.apk
            printf '{"code":%s,"name":"%s","notes":"GitHub Actions release %s","apkUrl":"https://github.com/ivankoval921-bit/MyHealth/releases/latest/download/MyHealth.apk"}\n' "$CODE" "$NAME" "$NAME" > dist/version.json
            gh release create "$TAG" dist/MyHealth.apk dist/version.json --title "MyHealth $TAG" --notes "Автосборка релиза $TAG" --latest || \
              gh release upload "$TAG" dist/MyHealth.apk dist/version.json --clobber
          fi
